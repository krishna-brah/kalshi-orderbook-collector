[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam = "0.8.4"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
hdrhistogram = { version = "7.6.0", default-features = false }
indexmap = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"

# Keep debug builds small: this Mac is short on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"

[[bin]]
name = "collector"
path = "src/main.rs"
